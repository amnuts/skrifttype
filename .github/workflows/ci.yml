name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  WAILS_EXP_USE_WAKE: '1'

jobs:
  go:
    name: Go test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # main.go embeds frontend/dist, which is gitignored; the Go job doesn't
      # build the frontend, so give the embed directive something to match.
      - name: Stub frontend/dist
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      # Tests run on Windows so the GDI activation code path (build-tagged
      # `windows`) is actually exercised, not just the cross-platform stubs.
      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  frontend:
    name: Frontend & bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      # Also verifies the Go sources compile on Linux (the !windows stubs) and
      # that bindings regenerate cleanly.
      - name: Generate bindings and build frontend
        run: wails3 build --targets linux/amd64
